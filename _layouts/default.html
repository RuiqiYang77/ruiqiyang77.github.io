---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode" hidden>
      <i class="fas fa-moon theme-toggle__moon" aria-hidden="true"></i>
      <i class="fas fa-sun theme-toggle__sun" aria-hidden="true"></i>
    </button>

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
          <footer class="page__updated">
            Last updated: <time datetime="{{ site.time | date: '%Y-%m' }}">{{ site.time | date: '%b %Y' }}</time>
          </footer>
        </div>
      </article>
    </div>

    {% include scripts.html %}

  </body>
</html>
